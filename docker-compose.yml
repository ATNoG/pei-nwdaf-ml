volumes:
  pgdata:
  minio-data:

services:
  mlservice:
    container_name: pei-ml
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8060:8060"
    environment:
      - API_HOST=${ML_HOST}
      - API_PORT=${ML_PORT}
      - LOG_LEVEL=${LOG_LEVEL}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - DATA_STORAGE_API_URL=${DATA_STORAGE_API_URL}
      - DATA_STORAGE_EXAMPLE_ENDPOINT=${DATA_STORAGE_EXAMPLE_ENDPOINT}
      - DATA_STORAGE_DATA_ENDPOINT=${DATA_STORAGE_DATA_ENDPOINT}
      - DATA_STORAGE_CELL_ENDPOINT=${DATA_STORAGE_CELL_ENDPOINT}
      - DATA_STORAGE_EXCLUDED_FIELDS=${DATA_STORAGE_EXCLUDED_FIELDS}
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_HOST=${KAFKA_HOST:-kafka}
      - KAFKA_PORT=${KAFKA_PORT:-9092}
      - KAFKA_INPUT_TOPIC=${KAFKA_INPUT_TOPIC:-network.data.processed}
      - KAFKA_OUTPUT_TOPIC=${KAFKA_OUTPUT_TOPIC:-network.ml.results}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_DEBOUNCE_SECONDS=${KAFKA_DEBOUNCE_SECONDS:-30}
      - MONITORING_ENABLED=${MONITORING_ENABLED:-true}
      - MONITORING_INTERVAL_SECONDS=${MONITORING_INTERVAL_SECONDS:-300}
      - MONITORING_TRIGGER_MODE=${MONITORING_TRIGGER_MODE:-time}
      - MONITORING_DEGRADATION_FACTOR=${MONITORING_DEGRADATION_FACTOR:-1.5}
      - SLACK_NOTIFY=${SLACK_NOTIFY:-false}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    networks:
      - nwdaf-ml
      - nwdaf-network
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nwdaf-ml
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    networks:
      - nwdaf-ml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mlflow-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio "http://${MINIO_HOST}:${MINIO_PORT}" \
          "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "myminio/${MINIO_BUCKET:-mlflow}"
    networks:
      - nwdaf-ml
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_VERSION}
    container_name: mlflow-server
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    networks:
      - nwdaf-ml
      - nwdaf-network
    environment:
      # Backend store URI built from vars
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}

      # S3/MinIO settings
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_IGNORE_TLS: "true"

      # Server host/port
      MLFLOW_BIND_HOST: ${MLFLOW_BIND_HOST:-0.0.0.0}
      MLFLOW_PORT: ${MLFLOW_PORT}

    # FIX: ASTERISK IS AN AWFUL CHOICE!!! DEVELOPMENT ONLY
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --default-artifact-root "${MLFLOW_DEFAULT_ARTIFACT_ROOT}" \
          --host "${MLFLOW_BIND_HOST}" \
          --port "${MLFLOW_PORT}" \
          --allowed-hosts "*"
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  nwdaf-ml:
    driver: bridge
  nwdaf-network:
    name: nwdaf-network
